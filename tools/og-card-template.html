<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>OG card template (1200x630)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet" />
<style>
  /* SOURCE for public/og-image.jpg. Edit here, then re-render (see bottom). */
  /* Colors match app/globals.css: --brand-bg and --brand-accent. */
  :root {
    --brand-dark: #0d1117;
    --brand-accent: #2dd4bf;
  }
  body { margin: 0; padding: 0; }
  .card {
    width: 1200px; height: 630px;
    box-sizing: border-box;
    background-color: var(--brand-dark);
    background-image:
      radial-gradient(circle at center, rgba(45, 212, 191, 0.10) 0%, transparent 60%),
      radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: cover, 20px 20px;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    font-family: Inter, -apple-system, system-ui, sans-serif;
    text-align: center;
  }
  /* All content stays inside the central ~800px: LinkedIn mobile crops the sides. */
  .icon {
    width: 168px; height: 168px;
    border-radius: 37px; /* iOS squircle proportion (~22%) */
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 12px 48px rgba(45, 212, 191, 0.18);
    margin-bottom: 32px;
  }
  .wordmark {
    font-size: 96px; font-weight: 800; letter-spacing: -0.02em;
    color: white; line-height: 1;
    text-shadow: 0 0 60px rgba(45, 212, 191, 0.35);
  }
  .tagline {
    margin-top: 24px;
    font-size: 48px; font-weight: 600; letter-spacing: -0.01em;
    color: var(--brand-accent); line-height: 1.1;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="icon" src="../public/favicon-512.png" alt="" />
    <div class="wordmark">MySellingMate</div>
    <div class="tagline">Snap it, price it, sell it</div>
  </div>
</body>
</html>

<!--
THIS FILE IS THE SOURCE. public/og-image.jpg IS BUILD OUTPUT.
Never edit the JPG by hand; change this file and re-render. Commit both together.

Copy rule: no em or en dashes in the card text. The DASHES check covers
messages/*.json only, not text baked into the image.

Render (headless Chrome or Chromium, from the repo root). CHROME is any Chrome
binary, e.g. "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" or
Playwright's "Google Chrome for Testing" under ~/Library/Caches/ms-playwright:
  "$CHROME" \
    --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
    --window-size=1200,630 --virtual-time-budget=5000 \
    --screenshot=/tmp/og.png "file://$PWD/tools/og-card-template.html"
  sips -s format jpeg -s formatOptions 90 /tmp/og.png --out public/og-image.jpg

Output must be 1200x630, JPG or PNG (never WebP: WhatsApp drops it), under ~200KB.
-->
